[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-finops-agent"
version = "0.1.0"
description = "Read-only Azure FinOps MCP server and automation CLI for the azure-finops Copilot custom agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "azure-identity>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "croniter>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "ruff>=0.6",
]

[project.scripts]
azure-finops-mcp = "azure_finops.server:main"
finops = "azure_finops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
azure_finops = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["E501", "S101", "S311", "S603", "S607", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "B011"]
