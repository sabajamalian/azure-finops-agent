name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp-server/pyproject.toml

      - name: Install
        run: python -m pip install --quiet -e "./mcp-server[dev]"

      - name: Lint
        working-directory: mcp-server
        run: |
          ruff format --check .
          ruff check .

      - name: Unit tests
        working-directory: mcp-server
        run: pytest

      - name: Schemas are current
        run: finops schemas export --check

      - name: Agent profile matches the allowlist
        run: finops check-agent-profile

      - name: Automations are valid
        run: |
          # The template ships only config.example.yaml; validate against it when there's no real config.
          if [ ! -f finops/config.yaml ]; then export FINOPS_CONFIG=finops/config.example.yaml; fi
          finops automations validate

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          curl -sSfL -o actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar xzf actionlint.tgz actionlint
          ./actionlint -color
