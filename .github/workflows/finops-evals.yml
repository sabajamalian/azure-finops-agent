name: finops-evals

# Runs the agent against synthetic Azure data (no Azure access) and grades the answers.
# Each case and repeat is one Copilot session and uses premium requests. Manual only.

on:
  workflow_dispatch:
    inputs:
      case:
        description: Case id to run (empty runs every case in evals/cases.yaml)
        required: false
        default: ""
      repeat:
        description: Runs per case
        required: false
        default: "1"
      model:
        description: Model id (empty uses agent.model from config or the CLI default)
        required: false
        default: ""

permissions: {}

concurrency:
  group: finops-evals
  cancel-in-progress: false

env:
  COPILOT_CLI_VERSION: "1.0.98"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  evals:
    runs-on: ubuntu-latest
    environment: finops # only for the optional COPILOT_GITHUB_TOKEN secret; no Azure login
    timeout-minutes: 120
    permissions:
      contents: read
      copilot-requests: write # Copilot CLI auth with this job's token when no PAT secret is set
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: mcp-server/pyproject.toml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install FinOps MCP server and Copilot CLI
        run: |
          python -m pip install --quiet ./mcp-server
          npm install --global --no-fund --no-audit "@github/copilot@${COPILOT_CLI_VERSION}"

      - name: Run evals
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          INPUT_CASE: ${{ inputs.case }}
          INPUT_REPEAT: ${{ inputs.repeat }}
          INPUT_MODEL: ${{ inputs.model }}
        run: |
          args=(evals run --out "$RUNNER_TEMP/evals" --repeat "$INPUT_REPEAT")
          if [ -n "$INPUT_CASE" ]; then args+=(--case "$INPUT_CASE"); fi
          if [ -n "$INPUT_MODEL" ]; then args+=(--model "$INPUT_MODEL"); fi
          finops "${args[@]}"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finops-evals-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evals
          retention-days: 14
          if-no-files-found: warn
