# Lets collaborators ask the agent questions from GitHub.com:
#   - open an issue with the "Ask the FinOps agent" form (or add the finops-ask label to your own issue)
#   - comment `/finops <follow-up question>` on a finops-ask issue
#   - comment `/finops approve` (or `/finops approve 1,3`) to create issues the agent proposed
# Only OWNER, MEMBER, and COLLABORATOR authors trigger runs. The task itself runs in finops-run.yml.
name: finops-ask

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  ask:
    if: >-
      vars.FINOPS_ENABLED == 'true' && (
        (github.event_name == 'issues'
          && github.event.label.name == 'finops-ask'
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
        || (github.event_name == 'issue_comment'
          && !github.event.issue.pull_request
          && contains(github.event.issue.labels.*.name, 'finops-ask')
          && startsWith(github.event.comment.body, '/finops')
          && !startsWith(github.event.comment.body, '/finops approve')
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # start finops-run.yml
    steps:
      - name: Start finops-run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          key="ask-${ISSUE}-${COMMENT_ID:-issue}"
          gh workflow run finops-run.yml --ref "$REF" \
            -f kind=ask -f issue="$ISSUE" -f comment_id="$COMMENT_ID" -f dedupe_key="$key"
          echo "Started finops-run for issue #$ISSUE ($key)" >> "$GITHUB_STEP_SUMMARY"

  approve:
    if: >-
      vars.FINOPS_ENABLED == 'true'
      && github.event_name == 'issue_comment'
      && !github.event.issue.pull_request
      && contains(github.event.issue.labels.*.name, 'finops-ask')
      && startsWith(github.event.comment.body, '/finops approve')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: finops-approve-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp-server/pyproject.toml

      - name: Install
        run: python -m pip install --quiet ./mcp-server

      - name: Create approved issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: finops approve --issue "$ISSUE" --comment-id "$COMMENT_ID"
